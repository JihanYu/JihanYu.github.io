<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임상 도구 모음집</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #2b6cb0;
            --primary-hover: #1a446c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .profile-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2d3748;
        }
        .profile-subtitle {
            font-size: 15px;
            color: #718096;
            margin-bottom: 32px;
        }
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-card {
            background-color: var(--card-bg);
            color: var(--primary-color);
            text-decoration: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--primary-color);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .link-card:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(43, 108, 176, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-title">임상 도구 모음집</div>
        <div class="profile-subtitle">진료실에서 사용하는 웹 앱 링크 모음</div>

        <div class="links-wrapper">
            
            <a href="https://clinical-preop.streamlit.app/" target="_blank" class="link-card">
                🩺 수술 전 위험도 평가 도구 (Pre-OP Risk)
            </a>

            <a href="https://liver-steatosis-fibrosis.streamlit.app/" target="_blank" class="link-card">
                🧪 지방간 점수 및 섬유화 계산기 (Fatty Liver)
            </a>

            </div>
    </div>

</body>
</html>
